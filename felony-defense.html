<html lang="en">
<head>

<title>Felony Defense | The Lahann Law Firm — Las Cruces, New Mexico</title>
<meta name="description" content="Serious felony charges demand serious defense. Thirty-five years of criminal trial experience in Las Cruces and southern New Mexico. Confidential consultations with Jeff Lahann.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#17150f;
    --ink-2:#211e16;
    --ink-3:#2c281e;
    --bone:#ece5d6;
    --bone-dim:#c9c0ad;
    --paper:#f3eee2;
    --oxblood:#7c2b2f;
    --oxblood-bright:#993539;
    --brass:#a98a52;
    --muted:#6b6354;
    --line-on-dark:rgba(236,229,214,0.14);
    --line-on-light:rgba(23,21,15,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    font-size:18px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 28px}
  /* legal-pad margin rule — the page's signature spine */
  .spine{position:relative;padding-left:34px}
  .spine::before{
    content:"";position:absolute;left:0;top:0;bottom:0;
    width:2px;background:var(--oxblood);opacity:.85;
  }
  .eyebrow{
    font-size:12.5px;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;color:var(--oxblood);
    display:flex;align-items:center;gap:12px;
  }
  .eyebrow.on-dark{color:var(--brass)}
  .eyebrow::after{content:"";height:1px;width:46px;background:currentColor;opacity:.5}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:500;line-height:1.05;letter-spacing:-.01em}
  em{font-style:italic;color:var(--oxblood)}
  .on-dark em{color:var(--brass)}
  /* ---------- NAV ---------- */
  header.site{
    position:absolute;top:0;left:0;right:0;z-index:10;
    padding:26px 0;
  }
  header.site .wrap{display:flex;align-items:center;justify-content:space-between}
  .mark{
    font-family:"Fraunces",serif;font-weight:500;font-size:21px;
    color:var(--bone);letter-spacing:.01em;text-decoration:none;line-height:1.1;
  }
  .mark small{display:block;font-family:"Hanken Grotesk",sans-serif;
    font-size:10.5px;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;color:var(--brass);margin-top:3px}
  .nav-cta{
    font-family:"Hanken Grotesk",sans-serif;font-size:14px;font-weight:600;
    color:var(--bone);text-decoration:none;border:1px solid var(--line-on-dark);
    padding:11px 20px;border-radius:2px;transition:.25s;white-space:nowrap;
  }
  .nav-cta:hover{background:var(--oxblood);border-color:var(--oxblood)}
  /* ---------- HERO ---------- */
  .hero{
    background:var(--ink);color:var(--bone);
    padding:172px 0 88px;position:relative;overflow:hidden;
  }
  .hero::after{ /* faint vertical brass hairline, far right — distant courtroom column */
    content:"";position:absolute;top:0;bottom:0;right:14%;
    width:1px;background:linear-gradient(var(--brass),transparent 70%);opacity:.22;
  }
  .hero .eyebrow{margin-bottom:30px}
  .hero h1{
    font-size:clamp(2.5rem,6.2vw,5.1rem);
    max-width:14ch;margin-bottom:30px;color:var(--bone);
  }
  .hero h1 .lede{display:block}
  .hero p.sub{
    font-size:clamp(1.05rem,1.7vw,1.32rem);
    color:var(--bone-dim);max-width:46ch;margin-bottom:42px;line-height:1.55;
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .btn{
    font-family:"Hanken Grotesk",sans-serif;font-size:16px;font-weight:600;
    text-decoration:none;padding:16px 30px;border-radius:2px;
    display:inline-flex;align-items:center;gap:10px;transition:.25s;cursor:pointer;
  }
  .btn-primary{background:var(--oxblood);color:#fff}
  .btn-primary:hover{background:var(--oxblood-bright);transform:translateY(-1px)}
  .btn-ghost{color:var(--bone);border:1px solid var(--line-on-dark)}
  .btn-ghost:hover{border-color:var(--brass);color:#fff}
  .hero-facts{
    margin-top:64px;padding-top:32px;border-top:1px solid var(--line-on-dark);
    display:grid;grid-template-columns:repeat(3,1fr);gap:28px;max-width:760px;
  }
  .fact .n{font-family:"Fraunces",serif;font-size:2.4rem;color:var(--bone);line-height:1}
  .fact .l{font-size:13px;color:var(--bone-dim);margin-top:8px;letter-spacing:.02em}
  /* ---------- STAKES ---------- */
  .stakes{background:var(--paper);padding:96px 0}
  .stakes .lead{
    font-family:"Fraunces",serif;font-size:clamp(1.6rem,3vw,2.5rem);
    font-weight:400;line-height:1.25;max-width:24ch;margin-bottom:22px;
  }
  .stakes p.body{max-width:58ch;color:var(--muted);font-size:1.08rem}
  .stakes p.body + p.body{margin-top:18px}
  /* ---------- DEFEND ---------- */
  .defend{background:var(--ink);color:var(--bone);padding:96px 0}
  .defend .head{max-width:48ch;margin-bottom:56px}
  .defend h2{font-size:clamp(2rem,4vw,3rem);color:var(--bone);margin:18px 0 18px}
  .defend .head p{color:var(--bone-dim);max-width:50ch}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-on-dark);border:1px solid var(--line-on-dark)}
  .cell{background:var(--ink);padding:34px 30px;transition:.3s}
  .cell:hover{background:var(--ink-2)}
  .cell .num{font-family:"Hanken Grotesk",sans-serif;font-size:12px;font-weight:700;
    letter-spacing:.16em;color:var(--brass);margin-bottom:18px}
  .cell h3{font-size:1.35rem;color:var(--bone);margin-bottom:12px}
  .cell p{font-size:.96rem;color:var(--bone-dim);line-height:1.5}
  /* ---------- DIFFERENCE ---------- */
  .diff{background:var(--paper);padding:100px 0}
  .diff .top{max-width:46ch;margin-bottom:60px}
  .diff h2{font-size:clamp(2rem,4vw,3rem);margin:18px 0}
  .diff-list{display:grid;grid-template-columns:1fr 1fr;gap:48px 64px}
  .diff-item h3{font-size:1.4rem;margin-bottom:12px}
  .diff-item p{color:var(--muted);font-size:1.02rem}
  .diff-item .rule{width:34px;height:2px;background:var(--oxblood);margin-bottom:20px}
  /* ---------- QUOTE / CONVICTION ---------- */
  .conviction{background:var(--ink-2);color:var(--bone);padding:104px 0;text-align:left}
  .conviction blockquote{
    font-family:"Fraunces",serif;font-weight:400;
    font-size:clamp(1.7rem,3.6vw,2.9rem);line-height:1.25;max-width:24ch;
  }
  .conviction .attr{margin-top:34px;font-size:14px;letter-spacing:.04em;color:var(--bone-dim)}
  .conviction .attr strong{color:var(--brass);font-weight:600}
  /* ---------- TESTIMONIALS ---------- */
  .testimonials{background:var(--paper);padding:100px 0}
  .testimonials .top{max-width:46ch;margin-bottom:14px}
